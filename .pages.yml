media:
  input: media
  output: /media

content:
  - name: photography
    label: Photography
    type: collection
    path: _photography
    filename: "{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date

      - name: image
        label: Image
        type: image
        required: true

      - name: alt
        label: Image description
        type: string
        required: true

      - name: category
        label: Category
        type: string

      - name: description
        label: Description
        type: rich-text

      - name: featured
        label: Featured
        type: boolean

      - name: order
        label: Display order
        type: number